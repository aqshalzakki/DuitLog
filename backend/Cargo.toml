[package]
name = "duitlog"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
argon2 = "=0.5.3"
axum = "=0.8.9"
base64 = "=0.22.1"
email_address = { version = "=0.2.9", default-features = false }
getrandom = "=0.4.3"
hmac = "=0.12.1"
# Bundled tzdb: same zone rules on the Windows dev box and a minimal Docker image without /usr/share/zoneinfo.
jiff = { version = "=1.0.1", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always"] }
lettre = { version = "=0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-native-tls", "macros", "migrate", "json"] }
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "=2.5.9"
uuid = { version = "=1.23.1", features = ["v4", "serde"] }
